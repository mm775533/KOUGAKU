<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画像工学 単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDEF;--ink:#12181B;--muted:#56666C;--line:#C3CFD2;
  --front:#151B1F;--front-ink:#EAF4F2;--back:#FBFCFA;--back-ink:#12181B;
  --accent:#1B7F70;--accent-ink:#fff;--btn:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1113;--ink:#E6EEEE;--muted:#93A4A9;--line:#2A363B;
  --front:#1B2529;--front-ink:#EAF4F2;--back:#DCE8E5;--back-ink:#12181B;
  --accent:#4CC3B0;--accent-ink:#0D1113;--btn:#182125;}}
:root[data-theme="dark"]{
  --bg:#0D1113;--ink:#E6EEEE;--muted:#93A4A9;--line:#2A363B;
  --front:#1B2529;--front-ink:#EAF4F2;--back:#DCE8E5;--back-ink:#12181B;
  --accent:#4CC3B0;--accent-ink:#0D1113;--btn:#182125;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.6;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:1.15rem;margin:0;font-weight:700}
.count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.scene{perspective:1200px}
.card{position:relative;min-height:min(52vh,360px);cursor:pointer;transform-style:preserve-3d;transition:transform .45s;outline-offset:4px;border-radius:14px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.front{background:var(--front);color:var(--front-ink);border:1px solid var(--line)}
.back{background:var(--back);color:var(--back-ink);transform:rotateY(180deg);border:1px solid var(--line)}
.face .big{font-size:clamp(1.6rem,6vw,2.3rem);font-weight:700;line-height:1.35;word-break:break-word}
.face .text{font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:1.85;max-width:30em}
.hint{position:absolute;bottom:12px;font-size:.78rem;opacity:.6}
.badge{position:absolute;top:12px;right:14px;font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px}
.row>button{flex:1}
button{font:inherit;font-weight:500;background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 10px;cursor:pointer;min-height:46px}
button:hover{border-color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tools button{font-size:.88rem;padding:9px 6px;min-height:40px}
.done{text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:14px}
.done p{margin:0 0 16px}
.keys{color:var(--muted);font-size:.78rem;text-align:center;margin:0}
.stats{display:flex;align-items:center;gap:12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.stats .grow{flex:1;display:flex;align-items:center;gap:8px}
.xpbar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:#E9A92B;transition:width .3s}
.stats button{min-height:34px;padding:4px 10px;font-size:1rem}
#combo{font-weight:700;min-width:6em;display:inline-block}
button:active{transform:scale(.95)}
#yes:active{transform:scale(.92)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx span{position:absolute;left:0;top:0;will-change:transform,opacity}
.fx .pop{font-weight:900;font-size:1.7rem;color:#E9A92B;white-space:nowrap;-webkit-text-stroke:2px rgba(0,0,0,.3);paint-order:stroke fill}
.fx .banner{font-weight:700;font-size:2.1rem;color:#E9A92B;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.fx .ring{border-radius:50%;border:6px solid;box-sizing:border-box}
.fx .slam{font-weight:900;font-size:clamp(3rem,16vw,7rem);white-space:nowrap;-webkit-text-stroke:3px rgba(0,0,0,.35);paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.25)}
body.fever{color:#12181B;background:linear-gradient(120deg,#ff6b6b,#E9A92B,#4CC3B0,#6C8CFF,#B58CFF,#ff6b6b);background-size:400% 400%;animation:bgmove 3s linear infinite}
body.fever .count,body.fever .keys{color:#12181B}
main.hot{animation:hue 2s linear infinite}
.card.fever{box-shadow:0 0 30px 6px #E9A92B,0 0 80px 18px rgba(255,107,107,.55)}
@keyframes bgmove{to{background-position:400% 50%}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.stage{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ff3b3b,#ffb02e,#fff23b,#3bd96b,#3bc7ff,#6c5cff,#d94bff,#ff3b3b);background-size:200% 100%;mix-blend-mode:color;opacity:0;transition:opacity .4s}
.stage.rainbow::before{opacity:.8;animation:rb 1.2s linear infinite}
.stage .dn{position:absolute;animation:hop .45s ease-in-out infinite alternate}
.stage .a1{transform-origin:30px 36px;animation:arm1 .4s ease-in-out infinite alternate}
.stage .a2{transform-origin:30px 36px;animation:arm2 .4s ease-in-out infinite alternate}
.stage .l1{transform-origin:30px 58px;animation:leg1 .4s ease-in-out infinite alternate}
.stage .l2{transform-origin:30px 58px;animation:leg2 .4s ease-in-out infinite alternate}
.stage .ball{position:absolute;top:-8px;left:50%;margin-left:-32px;font-size:64px;line-height:1;transform-origin:50% -30px;animation:swing 1.2s ease-in-out infinite alternate;display:none;filter:drop-shadow(0 0 14px #fff)}
.stage.disco .ball{display:block}
.stage .beam{position:absolute;top:0;width:40vw;height:100vh;display:none;transform-origin:50% 0;clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);animation:sweep 1.8s ease-in-out infinite alternate}
.stage .b1{left:-5vw;background:linear-gradient(rgba(255,232,106,.75),transparent 85%)}
.stage .b2{right:-5vw;background:linear-gradient(rgba(106,240,255,.75),transparent 85%);animation-direction:alternate-reverse}
.stage.lights .beam{display:block}
main.hot.wobble{animation:hue 2s linear infinite,sway .5s ease-in-out infinite alternate}
@keyframes rb{to{background-position:200% 0}}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-22px) rotate(6deg)}}
@keyframes arm1{from{transform:rotate(-10deg)}to{transform:rotate(140deg)}}
@keyframes arm2{from{transform:rotate(10deg)}to{transform:rotate(-140deg)}}
@keyframes leg1{from{transform:rotate(-15deg)}to{transform:rotate(20deg)}}
@keyframes leg2{from{transform:rotate(15deg)}to{transform:rotate(-20deg)}}
@keyframes swing{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes sweep{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes sway{from{transform:rotate(-1.5deg) scale(1)}to{transform:rotate(1.5deg) scale(1.02)}}
@media (prefers-reduced-motion:reduce){.card,.bar i,.xpbar i{transition:none}body.fever,main.hot,main.hot.wobble,.stage *,.stage::before{animation:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div><div class="ball">🪩</div></div>
<main>
  <header><h1>画像工学 単語帳</h1><span class="count" id="count" aria-live="polite"></span></header>
  <div class="stats">
    <span id="combo">🔥 0連続</span>
    <span class="grow"><span id="lv">Lv 1</span><span class="xpbar"><i id="xpfill"></i></span></span>
    <button id="mute" aria-label="音を消す">🔊</button>
  </div>
  <div class="bar" role="progressbar" aria-label="覚えた割合"><i id="fill"></i></div>

  <div id="study">
    <div class="scene">
      <div class="card" id="card" role="button" tabindex="0" aria-label="カードをめくる">
        <div class="face front"><span class="badge" id="state"></span><div class="big" id="fText"></div><span class="hint">タップでめくる</span></div>
        <div class="face back"><div class="text" id="bText"></div></div>
      </div>
    </div>
  </div>
  <div class="done" id="done" hidden>
    <p id="doneMsg"></p>
    <button class="primary" id="again">もう一度はじめる</button>
  </div>

  <div class="row" id="judge">
    <button id="no">まだ</button>
    <button id="yes" class="primary">覚えた</button>
  </div>
  <div class="row">
    <button id="prev">前へ</button>
    <button id="next">次へ</button>
  </div>
  <div class="row tools">
    <button id="shuffle">シャッフル</button>
    <button id="dir">用語 → 説明</button>
    <button id="only" aria-pressed="false">未習得のみ</button>
    <button id="reset">記録を消す</button>
  </div>
  <p class="keys">キー操作：Space めくる ／ ← → 移動 ／ 1 まだ ／ 2 覚えた</p>
</main>
<script>
const CARDS = [["画質の三大要素", "コントラスト・分解能・ノイズ（互いにトレードオフ）"], ["コントラスト", "信号と背景の濃度差。差が大きいほど見やすい"], ["空間分解能", "細かい構造（高い空間周波数）を分離できる能力"], ["ノイズ", "画像のざらつき。量子ノイズは相対ノイズ∝1/√N（線量↑で↓）"], ["散乱線含有率", "SF＝S/(S+P)。大きいほどコントラスト低下"], ["グリッド", "散乱線を吸収し一次線を通す。コントラスト改善（被曝↑）"], ["特性曲線", "入力（露光量logE）と出力（濃度/画素値）の関係を表す曲線"], ["ガンマ（階調度）", "特性曲線の直線部の傾き。大きいほど硬調（高コントラスト）"], ["ラチチュード", "適正濃度が得られる露光量の幅。ガンマと逆（トレードオフ）"], ["ダイナミックレンジ", "記録できる露光量（信号）の範囲。広いほど良い"], ["感度", "基準濃度を得るのに必要な露光量の少なさ（曲線の左右位置）"], ["ディジタルの特性", "対数リニア・広ラチチュード・表示を後から調整できる"], ["PSF", "点像分布関数。1点入力に対する応答（ボケの形）"], ["LSF", "線像分布関数。線入力への応答（PSFを線方向に積分）"], ["ESF", "エッジ広がり関数。エッジへの応答（微分でLSF）"], ["MTF", "周波数ごとのコントラスト伝達率。LSFのフーリエ変換（規格化）"], ["10%MTF", "MTFが10%になる空間周波数。高いほど高分解能"], ["系のMTF", "各要素のMTFの積。最も低い要素が律速"], ["量子ノイズ", "X線光子数の統計的ばらつき。ノイズの主因（σ∝√N）"], ["システムノイズ", "検出器・電気系由来のノイズ（線量に依存しにくい）"], ["構造ノイズ", "検出器の不均一など固定パターンのノイズ"], ["標準偏差σ", "ノイズの総量。周波数分布は分からない"], ["NPS", "ノイズの空間周波数分布（ウィーナースペクトル）。σ²＝∫NPS du"], ["白色/有色ノイズ", "白色＝全周波数一様、有色＝特定周波数に偏る"], ["物理評価", "MTF・NPS・DQE等で装置性能を数値評価（客観）"], ["視覚評価", "観察者が見て検出能を評価（ROC・AUC）"], ["感度（TPF）", "病変を正しく陽性とする割合＝TP/(TP+FN)"], ["特異度", "正常を正しく陰性とする割合＝TN/(TN+FP)"], ["ROC曲線", "縦軸TPF・横軸FPF。左上に近いほど検出能が高い"], ["AUC", "ROC曲線下面積（0〜1。実用上は0.5〜1）。大きいほど検出能が高い"]];
const KEY = "gazo-kogaku-known-v1";
let known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...known])); } catch (e) {} }

let order = CARDS.map((_, i) => i), pos = 0, termFirst = true, onlyUnknown = false;
const $ = id => document.getElementById(id);
const card = $("card");

function buildDeck(shuffle){
  let ids = CARDS.map((_, i) => i).filter(i => !onlyUnknown || !known.has(CARDS[i][0]));
  if (shuffle) for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  order = ids; pos = 0; render();
}
function render(){
  const total = CARDS.length, k = CARDS.filter(c => known.has(c[0])).length;
  $("count").textContent = "覚えた " + k + " / " + total;
  $("fill").style.width = (k / total * 100) + "%";
  const finished = pos >= order.length;
  $("study").hidden = finished; $("done").hidden = !finished;
  $("judge").style.display = finished ? "none" : "";
  $("prev").disabled = pos <= 0; $("next").disabled = finished;
  if (finished) {
    $("doneMsg").textContent = order.length === 0 ? "未習得のカードはありません。全部覚えました。" : "最後まで進みました。覚えた " + k + " / " + total + "。";
    return;
  }
  const c = CARDS[order[pos]];
  card.classList.remove("flip");
  if (!reduce) $("study").animate([{opacity:0,transform:"translateX(28px)"},{opacity:1,transform:"none"}],{duration:240,easing:"ease-out"});
  $("fText").textContent = termFirst ? c[0] : c[1];
  $("bText").textContent = termFirst ? c[1] : c[0];
  $("fText").className = termFirst ? "big" : "text";
  $("bText").className = termFirst ? "text" : "big";
  const st = $("state"); st.hidden = !known.has(c[0]); st.textContent = "覚えた";
}
function flip(){ if (pos < order.length) { card.classList.toggle("flip"); sfx("flip"); const r = card.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2; burst(x, y, 24, 1.4); emojis(x, y, 6); ring(x, y, "#E9A92B"); shake(6); buzz(10); } }
function go(d){ pos = Math.max(0, Math.min(order.length, pos + d)); render(); }
/* ---- feedback effects ---- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let combo = 0, xp = 0, muted = false, ac;
try { xp = +localStorage.getItem("gazo-xp") || 0; muted = localStorage.getItem("gazo-mute") === "1"; } catch (e) {}
const level = () => Math.floor(xp / 100) + 1;
const fx = document.createElement("div"); fx.className = "fx"; document.body.appendChild(fx);
const COLORS = ["#4CC3B0","#E9A92B","#FF6B6B","#6C8CFF","#B58CFF"];
const SCALE = [523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
const MILESTONES = {3:"🔥 3連続!",5:"⚡ 5連続!",10:"🚀 10連続!",15:"💎 15連続!",20:"👑 20連続!"};

function note(f, t, d, type, v){
  const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, s);
  g.gain.exponentialRampToValueAtTime(v, s + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, s + d);
  o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d + 0.02);
}
function hit(d, v){ const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = ac.createBufferSource(), g = ac.createGain(); g.gain.value = v; s.buffer = buf; s.connect(g); g.connect(ac.destination); s.start(); }
function sfx(k){
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    if (k === "yes") { const f = SCALE[Math.min(Math.max(combo,1) - 1, 7)]; [1, 1.25, 1.5, 2, 2.5].forEach((m, i) => note(f * m, i * .045, .22, i % 2 ? "triangle" : "square", .12)); note(f / 2, 0, .3, "sawtooth", .08); hit(.08, .15); }
    else if (k === "no") { [392, 370, 349, 330].forEach((f, i) => note(f, i * .16, i === 3 ? .5 : .16, "sawtooth", .1)); }
    else if (k === "flip") { note(500, 0, .08, "sawtooth", .04); note(1400, .04, .08, "triangle", .08); note(2100, .08, .1, "triangle", .06); }
    else if (k === "up") { [523.25,659.25,783.99,1046.5,1318.5,1568,2093].forEach((f, i) => { note(f, i * .07, .3, "triangle", .2); note(f * 2, i * .07 + .03, .2, "square", .05); }); hit(.25, .2); }
  } catch (e) {}
}
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function burst(x, y, n, spread){
  if (reduce) return; spread = spread || 1;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span"), sz = 5 + Math.random() * 6;
    s.style.cssText = "width:" + sz + "px;height:" + sz * (Math.random() < .5 ? 1 : .5) + "px;background:" + COLORS[i % COLORS.length] + ";border-radius:" + (Math.random() < .4 ? "50%" : "2px");
    fx.appendChild(s);
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1 * spread, d = (60 + Math.random() * 140) * spread;
    s.animate([
      {transform: "translate(" + x + "px," + y + "px) rotate(0deg)", opacity: 1},
      {transform: "translate(" + (x + Math.cos(a) * d) + "px," + (y + Math.sin(a) * d + 60) + "px) rotate(" + (Math.random() * 720 - 360) + "deg)", opacity: 0}
    ], {duration: 700 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.3,1)"}).onfinish = () => s.remove();
  }
}
function rain(n){
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span"), sz = 6 + Math.random() * 7, x = Math.random() * innerWidth;
    s.style.cssText = "width:" + sz + "px;height:" + sz * .55 + "px;background:" + COLORS[i % COLORS.length];
    fx.appendChild(s);
    s.animate([
      {transform: "translate(" + x + "px,-20px) rotate(0deg)", opacity: 1},
      {transform: "translate(" + (x + Math.random() * 120 - 60) + "px," + (innerHeight + 20) + "px) rotate(" + (Math.random() * 900) + "deg)", opacity: 1}
    ], {duration: 1600 + Math.random() * 1600, delay: Math.random() * 500, easing: "ease-in", fill: "backwards"}).onfinish = () => s.remove();
  }
}
function pop(x, y, text){
  if (reduce) return;
  const s = document.createElement("span"); s.className = "pop"; s.textContent = text; fx.appendChild(s);
  s.animate([
    {transform: "translate(" + x + "px," + y + "px) translateX(-50%)", opacity: 0},
    {transform: "translate(" + x + "px," + (y - 20) + "px) translateX(-50%)", opacity: 1, offset: .2},
    {transform: "translate(" + x + "px," + (y - 70) + "px) translateX(-50%)", opacity: 0}
  ], {duration: 800, easing: "ease-out"}).onfinish = () => s.remove();
}
function banner(text){
  if (reduce) return;
  const s = document.createElement("span"); s.className = "banner"; s.textContent = text; s.style.left = "50%"; s.style.top = "34%"; fx.appendChild(s);
  s.animate([
    {transform: "translate(-50%,-50%) scale(.4)", opacity: 0},
    {transform: "translate(-50%,-50%) scale(1.15)", opacity: 1, offset: .25},
    {transform: "translate(-50%,-70%) scale(1)", opacity: 1, offset: .7},
    {transform: "translate(-50%,-110%) scale(1)", opacity: 0}
  ], {duration: 1100, easing: "ease-out"}).onfinish = () => s.remove();
}
function bump(el){ if (!reduce) el.animate([{transform: "scale(1)"}, {transform: "scale(1.3)"}, {transform: "scale(1)"}], {duration: 260, easing: "ease-out"}); }
const EMOJI = ["🎉","✨","💥","⭐","🔥","💯","🌈","🎊","🚀","👑","💎","🧠","🥳","⚡"];
const PRAISE = ["いいね!","すごい!!","天才!","最高!!!","神!!","完璧!","ナイス!","つよい!!","止まらない!","ヤバい!!","正解!!!","えらい!"];
const rnd = (a, b) => a + Math.random() * (b - a);
function emojis(x, y, n, far){
  if (reduce) return; far = far || 1;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span"); s.textContent = EMOJI[(Math.random() * EMOJI.length) | 0];
    s.style.fontSize = rnd(20, 46) + "px"; fx.appendChild(s);
    const a = rnd(0, Math.PI * 2), d = rnd(80, 260) * far;
    s.animate([
      {transform: "translate(" + x + "px," + y + "px) scale(.2) rotate(0deg)", opacity: 1},
      {transform: "translate(" + (x + Math.cos(a) * d) + "px," + (y + Math.sin(a) * d) + "px) scale(1.2) rotate(" + rnd(-360, 360) + "deg)", opacity: 1, offset: .6},
      {transform: "translate(" + (x + Math.cos(a) * d * 1.1) + "px," + (y + Math.sin(a) * d * 1.1 + 80) + "px) scale(.8) rotate(" + rnd(-540, 540) + "deg)", opacity: 0}
    ], {duration: rnd(900, 1500), easing: "cubic-bezier(.15,.7,.3,1)"}).onfinish = () => s.remove();
  }
}
function ring(x, y, color){
  if (reduce) return;
  for (let i = 0; i < 3; i++) {
    const s = document.createElement("span"); s.className = "ring";
    s.style.cssText = "width:60px;height:60px;border-color:" + color; fx.appendChild(s);
    s.animate([
      {transform: "translate(" + x + "px," + y + "px) translate(-50%,-50%) scale(.2)", opacity: .9},
      {transform: "translate(" + x + "px," + y + "px) translate(-50%,-50%) scale(" + (8 + i * 3) + ")", opacity: 0}
    ], {duration: 700 + i * 150, delay: i * 90, easing: "ease-out", fill: "backwards"}).onfinish = () => s.remove();
  }
}
function flash(color, a){
  if (reduce) return;
  const s = document.createElement("span"); s.style.cssText = "width:100%;height:100%;background:" + color; fx.appendChild(s);
  s.animate([{opacity: a}, {opacity: 0}], {duration: 380, easing: "ease-out"}).onfinish = () => s.remove();
}
function shake(m){
  if (reduce) return;
  const k = [];
  for (let i = 0; i < 8; i++) k.push({transform: "translate(" + rnd(-m, m) + "px," + rnd(-m, m) + "px) rotate(" + rnd(-m / 6, m / 6) + "deg)"});
  k.push({transform: "none"});
  document.querySelector("main").animate(k, {duration: 360, easing: "linear"});
}
function slam(text, color){
  if (reduce) return;
  const s = document.createElement("span"); s.className = "slam"; s.textContent = text; s.style.color = color;
  s.style.left = "50%"; s.style.top = "46%"; fx.appendChild(s);
  const r = "rotate(" + rnd(-14, 14) + "deg)";
  s.animate([
    {transform: "translate(-50%,-50%) scale(4) " + r, opacity: 0},
    {transform: "translate(-50%,-50%) scale(.9) " + r, opacity: 1, offset: .2},
    {transform: "translate(-50%,-50%) scale(1.05) " + r, opacity: 1, offset: .35},
    {transform: "translate(-50%,-50%) scale(1) " + r, opacity: 1, offset: .75},
    {transform: "translate(-50%,-80%) scale(1.3) " + r, opacity: 0}
  ], {duration: 950, easing: "ease-out"}).onfinish = () => s.remove();
}
function fireworks(n){
  if (reduce) return;
  for (let i = 0; i < n; i++) setTimeout(() => {
    const x = rnd(40, innerWidth - 40), y = rnd(80, innerHeight * .6);
    burst(x, y, 36, 2.2); emojis(x, y, 5, .8); ring(x, y, COLORS[i % COLORS.length]); sfx("flip");
  }, i * 180);
}
function hype(v, x, y){
  if (v) {
    const c = COLORS[(Math.random() * COLORS.length) | 0];
    shake(Math.min(8 + combo * 2, 28)); flash(c, .35); ring(x, y, c);
    emojis(x, y, 8 + Math.min(combo, 12)); burst(x, y, 40, 1.5);
    slam(combo > 1 ? "×" + combo : PRAISE[(Math.random() * PRAISE.length) | 0], c); rainbowFlash(); if (combo % 10 === 0) spin();
    if (combo > 1 && Math.random() < .6) setTimeout(() => slam(PRAISE[(Math.random() * PRAISE.length) | 0], COLORS[(Math.random() * COLORS.length) | 0]), 250);
    buzz([15, 30, 15, 30, 30]);
  } else {
    shake(22); flash("#6C8CFF", .25); ring(x, y, "#6C8CFF");
    emojis(x, y, 6); slam("ドンマイ!", "#6C8CFF"); buzz([40, 30, 40]);
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || b.id === "yes" || b.id === "no") return;
  const r = b.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  burst(x, y, 16); emojis(x, y, 3); ring(x, y, COLORS[(Math.random() * COLORS.length) | 0]); sfx("flip"); buzz(8);
});
const stage = $("stage"); let beat = 0, bstep = 0;
function dancer(i){
  const c = COLORS[i % COLORS.length], s = rnd(.8, 1.7), d = document.createElement("div");
  d.className = "dn";
  d.style.cssText = "left:" + (((i * 37) % 88) + 2) + "%;bottom:" + rnd(0, 14) + "vh;animation-duration:" + rnd(.28, .6) + "s;animation-delay:-" + rnd(0, .5) + "s";
  d.innerHTML = '<svg viewBox="0 0 60 100" width="' + (70 * s) + '" height="' + (116 * s) + '"><g stroke="' + c + '" stroke-width="5" stroke-linecap="round" fill="none"><path d="M30 24V58"/><path class="a1" d="M30 36L12 52"/><path class="a2" d="M30 36L48 52"/><path class="l1" d="M30 58L18 90"/><path class="l2" d="M30 58L42 90"/><circle cx="30" cy="14" r="9" fill="' + c + '"/><rect x="20" y="10" width="20" height="5" rx="2" fill="#111" stroke="none"/></g></svg>';
  return d;
}
function kick(){
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);
  g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.0001, t + .2);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .22);
}
function tick(){
  if (muted || !ac || document.hidden) return;
  try {
    bstep++;
    if (bstep % 4 === 1) kick();
    if (bstep % 2 === 0) hit(.04, .05);
    if (bstep % 8 === 5) note(bstep % 16 < 8 ? 55 : 82.4, 0, .22, "sawtooth", .08);
    if (bstep % 8 === 3) note(SCALE[(bstep >> 1) % 8], 0, .12, "square", .04);
  } catch (e) {}
}
function updateStage(){
  const want = combo === 0 ? 0 : Math.min(combo * 2, 26);
  while (stage.querySelectorAll(".dn").length < want) stage.appendChild(dancer(stage.querySelectorAll(".dn").length));
  const ds = stage.querySelectorAll(".dn");
  for (let i = ds.length - 1; i >= want; i--) ds[i].remove();
  stage.classList.toggle("disco", combo >= 3);
  stage.classList.toggle("lights", combo >= 5);
  stage.classList.toggle("rainbow", combo >= 8);
  if (combo >= 3 && !beat) beat = setInterval(tick, 250);
  else if (combo < 3 && beat) { clearInterval(beat); beat = 0; }
}
function spin(){
  if (reduce) return;
  document.querySelector("main").animate([{transform: "rotate(0deg) scale(1)"}, {transform: "rotate(360deg) scale(.7)", offset: .5}, {transform: "rotate(720deg) scale(1)"}], {duration: 1100, easing: "ease-in-out"});
}
function rainbowFlash(){
  if (reduce) return;
  const s = document.createElement("span");
  s.style.cssText = "width:100%;height:100%;background:linear-gradient(100deg,#ff3b3b,#ffb02e,#fff23b,#3bd96b,#3bc7ff,#6c5cff,#d94bff);background-size:200% 100%";
  fx.appendChild(s);
  s.animate([{opacity: .6, backgroundPosition: "0% 0"}, {opacity: 0, backgroundPosition: "100% 0"}], {duration: 700, easing: "ease-out"}).onfinish = () => s.remove();
}
document.addEventListener("pointermove", e => { if (combo >= 5 && Math.random() < .35) emojis(e.clientX, e.clientY, 1, .3); });
function updateStats(){
  $("combo").textContent = "🔥 " + combo + "連続";
  $("lv").textContent = "Lv " + level();
  $("xpfill").style.width = (xp % 100) + "%";
  $("combo").style.fontSize = (0.9 + Math.min(combo, 20) * 0.08) + "rem";
  document.body.classList.toggle("fever", combo >= 5);
  document.querySelector("main").classList.toggle("hot", combo >= 10);
  document.querySelector("main").classList.toggle("wobble", combo >= 15);
  card.classList.toggle("fever", combo >= 3);
  updateStage();
  $("mute").textContent = muted ? "🔇" : "🔊";
  $("mute").setAttribute("aria-label", muted ? "音を出す" : "音を消す");
}

function mark(v){
  if (pos >= order.length) return;
  const t = CARDS[order[pos]][0];
  const r = (v ? $("yes") : $("no")).getBoundingClientRect(), x = r.left + r.width / 2, y = r.top;
  if (v) {
    const wasNew = !known.has(t), oldLv = level();
    known.add(t); combo++;
    const gain = 10 + Math.min(combo - 1, 10) * 2;
    xp += gain;
    sfx("yes"); hype(true, x, y); burst(x, y, 14 + Math.min(combo, 10) * 3); pop(x, y - 8, "+" + gain + " XP");
    bump($("combo")); bump($("xpfill").parentNode);
    if (level() > oldLv) { banner("⭐ Lv " + level() + "!"); sfx("up"); burst(x, y, 50, 1.8); flash("#fff", .7); fireworks(6); buzz([20, 40, 20]); }
    else if (MILESTONES[combo]) { banner(MILESTONES[combo]); sfx("up"); burst(x, y, 40, 1.6); flash("#fff", .5); fireworks(3); buzz([20, 40, 20]); }
    save(); try { localStorage.setItem("gazo-xp", xp); } catch (e) {}
    updateStats(); go(1);
    if (wasNew && CARDS.every(c => known.has(c[0]))) { banner("🎉 全部覚えた!"); slam("完全制覇!!!", "#E9A92B"); flash("#fff", .9); rain(400); fireworks(20); sfx("up"); }
    else if (pos >= order.length) { rain(40); sfx("up"); }
  } else {
    known.delete(t); combo = 0; sfx("no"); hype(false, x, y); pop(x, y - 8, "もう一回!");
    save(); updateStats(); go(1);
    if (pos >= order.length) { rain(40); sfx("up"); }
  }
}
card.addEventListener("click", flip);
card.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); flip(); } });
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("yes").onclick = () => mark(true);
$("no").onclick = () => mark(false);
$("shuffle").onclick = () => buildDeck(true);
$("again").onclick = () => buildDeck(false);
$("dir").onclick = () => { termFirst = !termFirst; $("dir").textContent = termFirst ? "用語 → 説明" : "説明 → 用語"; render(); };
$("only").onclick = () => { onlyUnknown = !onlyUnknown; $("only").setAttribute("aria-pressed", onlyUnknown); buildDeck(false); };
$("reset").onclick = () => { if (confirm("覚えた記録をすべて消します。よろしいですか？")) { known.clear(); save(); buildDeck(false); } };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && e.key === " ") return;
  if (e.key === " ") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "1") mark(false);
  else if (e.key === "2") mark(true);
});
$("mute").onclick = () => { muted = !muted; try { localStorage.setItem("gazo-mute", muted ? "1" : "0"); } catch (e) {} updateStats(); sfx("flip"); };
updateStats();
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>餃子売上カウンター</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff8ee;--card:#fff;--text:#2b2118;--sub:#7a6a5a;--accent:#e4572e;--line:#f0e2cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--card:#2a2018;--text:#f6ebdd;--sub:#b9a690;--accent:#ff7a50;--line:#3d2f22}}
:root[data-theme="dark"]{--bg:#1d1610;--card:#2a2018;--text:#f6ebdd;--sub:#b9a690;--accent:#ff7a50;--line:#3d2f22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px;position:relative;z-index:1}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.total{text-align:center}
.total .n{font-size:64px;font-weight:800;color:var(--accent);line-height:1}
.total .u{font-size:16px;color:var(--sub)}
.total .y{font-size:26px;font-weight:800;margin-top:8px}
button{font:inherit;border:0;border-radius:10px;padding:12px 0;background:var(--accent);color:#fff;font-weight:700;font-size:16px;cursor:pointer;width:56px}
button.sub{background:var(--line);color:var(--text)}
button:active{transform:scale(.96)}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
label{font-size:13px;color:var(--sub)}
.fl{padding:10px 0;border-bottom:1px solid var(--line)}
.fl:last-of-type{border:0}
.hd{display:flex;align-items:center;gap:8px}
.hd span{font-size:12px;color:var(--sub);margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.ln{display:flex;align-items:center;gap:6px;margin-top:6px}
.ln label{width:34px}
.mc{width:104px;padding:8px 6px;text-align:right;font-size:18px;font-weight:800}
.ln .yen{font-size:14px;color:var(--sub)}
ol{list-style:none;padding:0;margin:0}
li{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
.note{font-size:12px;color:var(--sub);margin-top:8px}
.warn{color:var(--accent);font-size:14px}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tg{width:auto;padding:6px 14px;font-size:14px}
.cardhd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cardhd .tgs{margin-left:auto;display:flex;gap:6px}
svg{width:100%;height:auto;display:block}
.pop{position:fixed;pointer-events:none;font-size:30px;z-index:99;animation:pop 900ms ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-130px) scale(1.3)}}
@media (prefers-reduced-motion:reduce){.pop,.rain{animation-duration:1ms}}
.big{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:100;pointer-events:none;white-space:nowrap;font-size:clamp(30px,10vw,56px);font-weight:900;color:var(--accent);background:var(--card);padding:14px 24px;border-radius:20px;border:3px solid var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.3);animation:bigpop 3s ease-out forwards}
@keyframes bigpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.rain{position:fixed;top:0;pointer-events:none;font-size:28px;z-index:99;opacity:0;animation:fall 2.2s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(-40px) rotate(0)}100%{opacity:1;transform:translateY(105vh) rotate(360deg)}}
svg text{fill:var(--sub);font-size:10px}
</style>
</head>
<body>
<canvas id="bg" style="position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none"></canvas>
<main>
<h1>🥟 餃子売上カウンター</h1>
<div class="card total"><div class="n" id="total">0</div><div class="u">個 売れました</div><div class="u" id="pile" style="margin-top:4px"></div>
<div class="y">売上金額 <span id="revtotal">0</span> 円</div></div>

<div class="card" id="panel">
<label>あなたの名前（担当）<input id="name" placeholder="例：田中" maxlength="12"></label>
<div id="flavors" style="margin-top:8px"></div>
<div class="note">個数も金額も、数字を直接入力できます（入力後に外をタップで確定）。個数はボタンでも変えられます。金額は自動計算されません。時間帯は入力した時刻で記録されます。</div>
<div class="warn" id="msg"></div>
</div>

<div class="card"><div class="cardhd"><b>時間帯ごとの売上</b><div class="tgs"><button class="tg on" id="mc">個数</button><button class="tg sub" id="mr">金額</button></div></div>
<div id="chart"></div><div class="leg" id="leg"></div></div>

<div class="card"><b>担当者ごとの合計</b><ol id="list"></ol></div>

<div class="card"><b>🔒 管理者モード</b>
<div id="lockbox" style="margin-top:8px"><input id="pw" type="password" placeholder="パスワード" autocomplete="off"><div style="margin-top:8px"><button id="unlock" style="width:100%">開く</button></div><div class="warn" id="pwmsg"></div></div>
<div id="adminbox" style="display:none;margin-top:8px"><div class="note" style="margin:0 0 8px">上の「担当者ごとの合計」に削除ボタンが出ています。</div><button id="resetall" style="width:100%">全員の記録をリセット</button><button id="lockbtn" class="sub" style="width:100%;margin-top:8px">管理者モードを閉じる</button></div></div>
</main>
<script>
(function(){
  var F=[["n","ノーマル","#e4a12e"],["c","チーズ","#f2c94c"],["s","スタミナ","#d64545"],["d","デカ餃子","#8e5bd6"],["g","ネギ","#3fa86b"]];
  var uid=null,col=null,docs=[],loaded=false,writing=false,dirty=false,existed=false,admin=false,mode="c";
  var mine={name:"",counts:{},rev:{},hourly:{},hourlyRev:{}};
  var HASH="91829d969adf6d535e5d6bd635a43ade096f182efc08fd1336802bb736f6b4ff";
  var $=function(i){return document.getElementById(i)};
  try{$("name").value=localStorage.getItem("gy_name")||""}catch(e){}
  function sum(o){var t=0;for(var k in(o||{}))t+=o[k]||0;return t}
  function yen(n){return (n||0).toLocaleString()}
  function resetMine(){mine.counts={};mine.rev={};mine.hourly={};mine.hourlyRev={}}
  function hasData(){return sum(mine.counts)+sum(mine.rev)>0}
  function syncOwn(m){m.name=mine.name;m.counts=mine.counts;m.rev=mine.rev;m.hourly=mine.hourly;m.hourlyRev=mine.hourlyRev}
  function ownEntry(){var m=docs.filter(function(d){return d.id===uid})[0];if(!m){m={id:uid};docs.push(m)}syncOwn(m)}

  F.forEach(function(f){
    var r=document.createElement("div");r.className="fl";var k=f[0];
    r.innerHTML='<div class="hd"><i class="dot" style="background:'+f[2]+'"></i><b>'+f[1]+'</b><span id="t_'+k+'"></span></div>'+
      '<div class="ln"><label>個数</label><input class="mc" id="c_'+k+'" type="number" inputmode="numeric" min="0" value="0"><span class="yen">個</span>'+
      '<button class="sub" data-f="'+k+'" data-d="-1">−1</button><button data-f="'+k+'" data-d="1">+1</button><button data-f="'+k+'" data-d="3">+3</button></div>'+
      '<div class="ln"><label>金額</label><input class="mc" id="r_'+k+'" type="number" inputmode="numeric" min="0" value="0"><span class="yen">円</span></div>';
    $("flavors").appendChild(r);
  });
  $("leg").innerHTML=F.map(function(f){return '<span><i style="background:'+f[2]+'"></i>'+f[1]+'</span>'}).join("");

  var MAX=480,lastC=null,lastDrawn=-1,curC=0;
  function rnd(i){var x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x)}
  function drawPile(n){
    curC=n;n=Math.min(n,MAX);
    var cv=$("bg"),dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);lastDrawn=-1}
    if(n===lastDrawn)return;lastDrawn=n;
    var g=cv.getContext("2d");if(!g)return;
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    var cols=Math.max(5,Math.min(Math.floor(W/24),36)),cw=Math.min(W/cols,26),size=cw*1.15,x0=(W-cw*cols)/2;
    g.font=size+"px serif";g.textAlign="center";g.textBaseline="alphabetic";g.globalAlpha=.9;
    for(var i=0;i<n;i++){
      var row=Math.floor(i/cols),k=((i%cols)*37)%cols;
      g.fillText("🥟",x0+cw*(k+.5)+(rnd(i)-.5)*cw*.4,H-8-row*size*.72-rnd(i+999)*5);
    }
  }
  window.addEventListener("resize",function(){lastDrawn=-1;drawPile(curC)});
  function celebrate(text){
    var e=document.createElement("div");e.className="big";e.textContent="🎉 "+text;document.body.appendChild(e);setTimeout(function(){e.remove()},3200);
    for(var i=0;i<28;i++)(function(){var s=document.createElement("span");s.className="rain";s.textContent="🥟";s.style.left=(Math.random()*95)+"vw";s.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(s);setTimeout(function(){s.remove()},3800)})();
  }
  function render(){
    var tc={},tr={},hc={},hr={},c=0,r=0;
    F.forEach(function(f){tc[f[0]]=0;tr[f[0]]=0});
    docs.forEach(function(d){
      F.forEach(function(f){tc[f[0]]+=(d.counts||{})[f[0]]||0;tr[f[0]]+=(d.rev||{})[f[0]]||0});
      [[d.hourly,hc],[d.hourlyRev,hr]].forEach(function(p){
        for(var h in(p[0]||{})){p[1][h]=p[1][h]||{};F.forEach(function(f){p[1][h][f[0]]=(p[1][h][f[0]]||0)+((p[0][h]||{})[f[0]]||0)})}
      });
    });
    F.forEach(function(f){var k=f[0];c+=tc[k];r+=tr[k];
      $("t_"+k).textContent="全体 "+tc[k]+" 個 / "+yen(tr[k])+" 円";
      var a=$("c_"+k),b=$("r_"+k);
      if(document.activeElement!==a)a.value=mine.counts[k]||0;
      if(document.activeElement!==b)b.value=mine.rev[k]||0;
    });
    $("total").textContent=c;$("revtotal").textContent=yen(r);
    $("pile").textContent=c>=MAX?"🥟 背景が餃子で山盛り！（"+MAX+"個達成）":"背景の餃子 "+c+" / "+MAX+" 個";
    drawPile(c);
    if(loaded){var ms=Math.floor(c/100);if(lastC!==null){if(ms>Math.floor(lastC/100))celebrate(ms*100+"個突破！");else if(lastC<MAX&&c>=MAX)celebrate(MAX+"個！山盛り達成！")}lastC=c}
    var s=docs.slice().sort(function(a,b){return sum(b.counts)-sum(a.counts)});
    $("list").innerHTML="";
    s.forEach(function(d){
      var li=document.createElement("li"),a=document.createElement("span"),b=document.createElement("b");
      a.style.flex="1";a.textContent=(d.id===uid?"⭐ ":"")+(d.name||"名無し");
      b.textContent=sum(d.counts)+" 個 / "+yen(sum(d.rev))+" 円";
      li.appendChild(a);li.appendChild(b);
      if(admin){var x=document.createElement("button");x.className="sub";x.textContent="削除";x.style.cssText="width:auto;padding:4px 10px;font-size:13px;margin-left:8px";x.onclick=function(){delOne(d.id,x)};li.appendChild(x)}
      $("list").appendChild(li);
    });
    chart(mode==="c"?hc:hr);
  }

  function chart(hours){
    var hs=Object.keys(hours).map(Number),lo=Math.min(9,hs.length?Math.min.apply(0,hs):9),hi=Math.max(17,hs.length?Math.max.apply(0,hs):17);
    var W=420,H=200,L=44,B=22,T=10,n=hi-lo+1,bw=(W-L)/n,max=1,h;
    for(h=lo;h<=hi;h++)max=Math.max(max,sum(hours[h]));
    var raw=max/5,p=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),m=raw/p,step=(m<=1?1:m<=2?2:m<=5?5:10)*p;
    if(step<1)step=1;max=Math.ceil(max/step)*step;
    var ph=H-B-T,out='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="時間帯ごとのグラフ">';
    for(var v=0;v<=max;v+=step){var y=T+ph-ph*v/max;out+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="currentColor" opacity=".12"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+yen(v)+'</text>'}
    for(h=lo;h<=hi;h++){
      var x=L+(h-lo)*bw+bw*.12,w=bw*.76,yy=T+ph,hh=hours[h]||{};
      F.forEach(function(f){var c=hh[f[0]]||0;if(!c)return;var bh=ph*c/max;yy-=bh;out+='<rect x="'+x+'" y="'+yy+'" width="'+w+'" height="'+bh+'" fill="'+f[2]+'"/>'});
      var tt=sum(hh);if(tt)out+='<text x="'+(x+w/2)+'" y="'+(yy-3)+'" text-anchor="middle" style="fill:var(--text)">'+yen(tt)+'</text>';
      out+='<text x="'+(x+w/2)+'" y="'+(H-7)+'" text-anchor="middle">'+h+'時</text>';
    }
    $("chart").innerHTML=out+'</svg>';
  }
  function setMode(m){mode=m;$("mc").className="tg"+(m==="c"?" on":" sub");$("mr").className="tg"+(m==="r"?" on":" sub");render()}
  $("mc").onclick=function(){setMode("c")};$("mr").onclick=function(){setMode("r")};

  function save(){if(!col||!loaded)return;dirty=true;if(!writing)flush()}
  function flush(){
    if(!dirty)return;dirty=false;writing=true;
    var data=JSON.parse(JSON.stringify({name:mine.name,counts:mine.counts,rev:mine.rev,hourly:mine.hourly,hourlyRev:mine.hourlyRev}));
    col.doc(uid).set(data).then(function(){$("msg").textContent=""}).catch(function(){
      $("msg").textContent="保存できませんでした。共有リンクの権限（編集可）を確認してください。";
    }).then(function(){writing=false;if(dirty)flush()});
  }
  function err(){$("msg").textContent="操作できませんでした。権限を確認してください。"}

  function addHourly(H,f,d){
    var h=new Date().getHours();
    if(d>0){H[h]=H[h]||{};H[h][f]=(H[h][f]||0)+d;return}
    var left=-d,order=[h].concat(Object.keys(H).map(Number).filter(function(k){return k!==h}).sort(function(a,b){return b-a}));
    order.forEach(function(k){
      if(left<=0||!H[k])return;
      var t=Math.min(left,H[k][f]||0);H[k][f]=(H[k][f]||0)-t;left-=t;
    });
  }
  function apply(k,f,d){
    if(!col||!loaded){$("msg").textContent="接続中です。少し待ってからもう一度入力してください。";render();return}
    var M=k==="c"?mine.counts:mine.rev,H=k==="c"?mine.hourly:mine.hourlyRev,cur=M[f]||0;
    if(cur+d<0)d=-cur;
    if(d===0)return;
    M[f]=cur+d;addHourly(H,f,d);
    ownEntry();render();save();
  }
  function burst(btn,n){
    var r=btn.getBoundingClientRect();
    for(var i=0;i<n;i++)(function(){
      var e=document.createElement("span");e.className="pop";e.textContent="🥟";
      e.style.left=(r.left+r.width/2-15+(Math.random()*30-15))+"px";e.style.top=(r.top-8)+"px";
      e.style.setProperty("--dx",(Math.random()*80-40)+"px");
      document.body.appendChild(e);setTimeout(function(){e.remove()},1000);
    })();
  }
  $("flavors").onclick=function(e){
    var b=e.target.closest("button");if(!b)return;
    var d=+b.dataset.d;
    if(d>0&&col&&loaded)burst(b,d);
    apply("c",b.dataset.f,d);
  };
  $("flavors").addEventListener("change",function(e){
    var el=e.target;if(!el.id||!/^[cr]_/.test(el.id))return;
    var k=el.id[0],f=el.id.slice(2),M=k==="c"?mine.counts:mine.rev,v=Math.max(0,Math.floor(+el.value||0));
    apply(k,f,v-(M[f]||0));el.value=M[f]||0;
  });
  var tm;
  $("name").oninput=function(){
    mine.name=this.value;
    try{localStorage.setItem("gy_name",this.value)}catch(e){}
    clearTimeout(tm);tm=setTimeout(function(){if(col&&loaded&&hasData()){ownEntry();render();save()}},600);
  };

  async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
  function armed(btn,label,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed=1;btn.textContent="もう一度押すと実行";setTimeout(function(){delete btn.dataset.armed;btn.textContent=label},3000)}
  function delOne(id,btn){armed(btn,"削除",function(){if(id===uid)resetMine();col.doc(id).delete().catch(err)})}
  $("unlock").onclick=async function(){
    try{if(await sha($("pw").value)===HASH){admin=true;$("lockbox").style.display="none";$("adminbox").style.display="block";$("pwmsg").textContent="";$("pw").value="";render()}else{$("pwmsg").textContent="パスワードが違います"}}catch(e){$("pwmsg").textContent="この環境では使えません"}
  };
  $("lockbtn").onclick=function(){admin=false;$("lockbox").style.display="";$("adminbox").style.display="none";render()};
  $("resetall").onclick=function(){var b=this;armed(b,"全員の記録をリセット",function(){if(!col)return;resetMine();docs.forEach(function(d){col.doc(d.id).delete().catch(err)})})};

  render();
  (async function(){
    try{
      var user=await claude.use("user"),db=await claude.use("db");
      if(!user||!db){$("msg").textContent="共有機能が使えません。claude.aiにログインして開いてください。";return}
      uid=await user.id();col=db.collection("sales");mine.name=$("name").value;
      col.onSnapshot(function(snap){
        docs=snap.docs.map(function(s){var v=(typeof s.data==="function"?s.data():s.data)||{};return {id:s.id,name:v.name,counts:v.counts||{},rev:v.rev||{},hourly:v.hourly||{},hourlyRev:v.hourlyRev||{}}});
        var m=docs.filter(function(d){return d.id===uid})[0];
        if(!loaded){loaded=true;existed=!!m;if(m){mine.counts=m.counts;mine.rev=m.rev;mine.hourly=m.hourly;mine.hourlyRev=m.hourlyRev;if(m.name&&!$("name").value){$("name").value=m.name;mine.name=m.name}}}
        else if(m){existed=true;syncOwn(m)}
        else if(existed&&!writing&&!dirty){resetMine();existed=false}
        else if(hasData()){ownEntry()}
        render();
      },function(){$("msg").textContent="データを読み込めませんでした。"});
    }catch(e){$("msg").textContent="共有機能に接続できませんでした。"}
  })();
})();
</script>
</body>
</html>
